name: videos

# Finds new embeddable videos for every category once a day and commits docs/videos.json.
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python tools/fetch_videos.py
      - name: Commit if the list changed
        run: |
          git diff --quiet docs/videos.json && { echo "no change"; exit 0; }
          git config user.name "nonuthub-video-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/videos.json
          git commit -m "Daily video list: $(python -c "import json;print(len(json.load(open('docs/videos.json'))['videos']))") videos"
          git push

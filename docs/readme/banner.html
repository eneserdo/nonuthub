<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NoNutHub banner</title>
<link rel="stylesheet" href="../style.css">
<style>
  /* Source of docs/readme/banner.png and docs/og.png: python tools/shots.py */
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; background: #000; }
  .copy { position: absolute; left: 72px; top: 150px; width: 560px; }
  .copy .logo { font-size: 92px; letter-spacing: -2px; }
  .copy .logo .l2 { border-radius: 12px; padding: 4px 16px 8px; }
  .copy p { margin: 34px 0 0; font: bold 34px/1.2 Arial, Helvetica, sans-serif; }
  .copy small { display: block; margin-top: 16px; color: #a8a8a8; font: 21px/1.45 Arial, Helvetica, sans-serif; }
  .copy .url { display: block; margin-top: 30px; color: #ff9000; font: bold 19px Arial, Helvetica, sans-serif; }
  .cats { position: absolute; right: 64px; top: 114px; width: 520px; display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .cats div { padding: 18px 18px 16px; background: #151515; border-left: 4px solid #ff9000; border-radius: 3px; }
  .cats b { display: block; font: bold 22px Arial, Helvetica, sans-serif; }
  .cats span { display: block; margin-top: 4px; color: #a8a8a8; font: 15px Arial, Helvetica, sans-serif; }
  .cats em { display: block; margin-top: 10px; color: #ff9000; font: bold 13px Arial, Helvetica, sans-serif; font-style: normal; }
</style>
</head>
<body>
  <div class="copy">
    <span class="logo"><span class="l1">NoNut</span><span class="l2">Hub</span></span>
    <p>The tab you open instead.</p>
    <small>Real videos that help against an urge, from guided urge surfing to Bob Ross, sorted by what the research says works.</small>
    <span class="url">eneserdo.github.io/nonuthub</span>
  </div>
  <div class="cats" id="cats"></div>
<script type="module">
  import { CATEGORIES, VIDEOS, STUDIES } from "../data.js";
  for (const c of CATEGORIES.slice(0, 6)) {
    const d = document.createElement("div");
    d.innerHTML = `<b>${c.name}</b><span>${c.desc}, ${VIDEOS.filter(v => v.cat === c.id).length} videos</span><em>${STUDIES[c.studies[0]].cite}</em>`;
    document.getElementById("cats").append(d);
  }
</script>
</body>
</html>
